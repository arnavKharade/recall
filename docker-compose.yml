services:
  db:
    image: pgvector/pgvector:pg16
    container_name: recall-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recall_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - recall_ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test:
        - CMD-SHELL
        - ollama list 2>/dev/null | grep -Fq '${OLLAMA_MODEL:-qwen2.5:3b}'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Run once on first setup to pull the model into the persistent Ollama volume.
  # It is not part of the normal `docker compose up` path.
  ollama-model-setup:
    image: ollama/ollama:latest
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until ollama list >/dev/null 2>&1; do sleep 2; done; exec ollama pull '${OLLAMA_MODEL:-qwen2.5:3b}'"
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - recall_ollama_data:/root/.ollama
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SECRET_KEY: ${SECRET_KEY:?Set a unique SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}"
      STORAGE_DIR: /var/lib/recall/documents
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-26214400}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      HF_HOME: /var/cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SECRET_KEY: ${SECRET_KEY:?Set a unique SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}"
      STORAGE_DIR: /var/lib/recall/documents
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-26214400}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      HF_HOME: /var/cache/huggingface
    volumes:
      - recall_documents:/var/lib/recall/documents
      - recall_embedding_cache:/var/cache/huggingface
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/database', timeout=4)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # Optional public HTTPS entrypoint for a VPS deployment. Keep it opt-in so
  # existing local development continues to use the frontend port directly.
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    environment:
      RECALL_DOMAIN: ${RECALL_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - recall_caddy_data:/data
      - recall_caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  recall_postgres_data:
  recall_documents:
  recall_ollama_data:
  recall_embedding_cache:
  recall_caddy_data:
  recall_caddy_config:
